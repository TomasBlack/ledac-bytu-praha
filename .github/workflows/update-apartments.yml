name: Update Apartments

on:
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        run: python scripts/collector.py

      - name: Upload generated file
        uses: actions/upload-artifact@v4
        with:
          name: generated-apartments
          path: apartments-generated.json
