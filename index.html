<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Hledač bytů Praha</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    background: #f4f6f8;
}

h1 {
    color: #1e3a8a;
}

.filters {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card {
    background: white;
    margin: 12px 0;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.good {
    border-left: 6px solid green;
}

.bad {
    border-left: 6px solid red;
}

.favorite {
    border-left: 6px solid gold;
}

.score {
    font-size: 28px;
    font-weight: bold;
    color: green;
}

button {
    padding: 8px 12px;
    cursor: pointer;
    margin-right: 5px;
}

.favoriteBtn {
    background: gold;
    border: none;
    border-radius: 5px;
}

.section-title {
    margin-top: 30px;
    color: #374151;
}
</style>
</head>

<body>

<h1>🏠 Hledač bytů Praha</h1>

<div class="filters">

<label>Cena max:</label>
<input id="priceMax" type="number" value="10000000">

&nbsp;&nbsp;

<label>Plocha min:</label>
<input id="areaMin" type="number" value="45">

&nbsp;&nbsp;

<button onclick="loadApartments()">
Použít filtr
</button>

</div>

<h2 class="section-title">⭐ Oblíbené byty</h2>
<div id="favorites"></div>

<h2 class="section-title">✅ Doporučené byty</h2>
<div id="recommended"></div>

<h2 class="section-title">❌ Vyřazené byty</h2>
<div id="rejected"></div>

<script>

function getFavorites(){
    return JSON.parse(localStorage.getItem("favorites") || "[]");
}

function saveFavorite(id){

    let favorites = getFavorites();

    if(!favorites.includes(id)){
        favorites.push(id);
    }

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

    loadApartments();
}

function spocitejSkore(b){

    if(b.construction === "panel"){
        return {
            vyrazen:true,
            duvod:"Panelový dům"
        };
    }

    if(b.layout === "atelier"){
        return {
            vyrazen:true,
            duvod:"Ateliér"
        };
    }

    let score = 50;
    let duvody = [];

    if(b.metro_distance_m <= 300){
        score += 20;
        duvody.push("+20 Metro do 300 m");
    }
    else if(b.metro_distance_m <= 600){
        score += 15;
        duvody.push("+15 Metro do 600 m");
    }

    if(b.tram_distance_m <= 300){
        score += 10;
        duvody.push("+10 Tramvaj");
    }

    if(b.price < 8000000){
        score += 15;
        duvody.push("+15 Cena pod 8 mil.");
    }
    else if(b.price < 9000000){
        score += 10;
        duvody.push("+10 Cena pod 9 mil.");
    }

    if(b.area_m2 > 60){
        score += 10;
        duvody.push("+10 Plocha nad 60 m²");
    }

    if(b.balcony){
        score += 10;
        duvody.push("+10 Balkon");
    }

    if(b.cellar){
        score += 5;
        duvody.push("+5 Sklep");
    }

    if(b.elevator){
        score += 5;
        duvody.push("+5 Výtah");
    }

    return {
        vyrazen:false,
        score:score,
        duvody:duvody
    };
}

function loadApartments(){

fetch('./apartments.json')
.then(response => response.json())
.then(byty => {

    const favorites =
      getFavorites();

    const recommendedDiv =
      document.getElementById("recommended");

    const rejectedDiv =
      document.getElementById("rejected");

    const favoritesDiv =
      document.getElementById("favorites");

    recommendedDiv.innerHTML = "";
    rejectedDiv.innerHTML = "";
    favoritesDiv.innerHTML = "";

    const priceMax =
      parseInt(document.getElementById("priceMax").value);

    const areaMin =
      parseInt(document.getElementById("areaMin").value);

    let recommended = [];
    let rejected = [];

    byty
      .filter(b => b.price <= priceMax)
      .filter(b => b.area_m2 >= areaMin)
      .forEach(b => {

        const info =
          spocitejSkore(b);

        if(info.vyrazen){

            rejected.push({
                byt:b,
                info:info
            });

        } else {

            recommended.push({
                byt:b,
                info:info
            });

        }

      });

    recommended.sort(
      (a,b) => b.info.score - a.info.score
    );

    recommended.forEach((item,index) => {

        const b = item.byt;
        const info = item.info;

        const card =
          document.createElement("div");

        card.className =
          "card good";

        card.innerHTML = `
            <h3>#${index + 1} ${b.title}</h3>

            <div class="score">
                ${info.score} bodů
            </div>

            <p>
                Cena:
                ${b.price.toLocaleString('cs-CZ')} Kč
            </p>

            <p>
                Plocha:
                ${b.area_m2} m²
            </p>

            <ul>
                ${info.duvody.map(
                    d => `<li>${d}</li>`
                ).join("")}
            </ul>

            <button
               class="favoriteBtn"
               onclick="saveFavorite(${b.id})">
               ⭐ Oblíbené
            </button>
        `;

        recommendedDiv.appendChild(card);

        if(favorites.includes(b.id)){

            const fav =
              card.cloneNode(true);

            fav.className =
              "card favorite";

            favoritesDiv.appendChild(fav);
        }

    });

    rejected.forEach(item => {

        const card =
          document.createElement("div");

        card.className =
          "card bad";

        card.innerHTML = `
            <h3>${item.byt.title}</h3>
            <p>❌ Vyřazeno</p>
            <p>${item.info.duvod}</p>
        `;

        rejectedDiv.appendChild(card);
    });

});
}

loadApartments();

</script>

</body>
</html>
