<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Hledač bytů Praha</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    background: #f4f6f8;
}

h1 {
    color: #1e3a8a;
}

.filters {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card {
    background: white;
    margin: 10px 0;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.good {
    border-left: 6px solid green;
}

.bad {
    border-left: 6px solid red;
}

.score {
    font-size: 24px;
    font-weight: bold;
    color: green;
}

a {
    color: #2563eb;
    text-decoration: none;
}

button {
    padding: 8px 12px;
}
</style>
</head>

<body>

<h1>🏠 Hledač bytů Praha</h1>

<div class="filters">

<label>Cena max:</label>
<input id="priceMax" type="number" value="10000000">

&nbsp;&nbsp;

<label>Plocha min:</label>
<input id="areaMin" type="number" value="45">

&nbsp;&nbsp;

<button onclick="loadApartments()">
Použít filtr
</button>

</div>

<div id="vysledek">
Načítám...
</div>

<script>

function spocitejSkore(b){

    if(b.construction === "panel"){
        return {
            vyrazen: true,
            duvod: "Panelový dům"
        };
    }

    if(b.layout === "atelier"){
        return {
            vyrazen: true,
            duvod: "Ateliér"
        };
    }

    let score = 50;

    if(b.metro <= 300){
        score += 20;
    } else if(b.metro <= 600){
        score += 15;
    }

    if(b.tram <= 300){
        score += 10;
    }

    if(b.price < 8000000){
        score += 15;
    } else if(b.price < 9000000){
        score += 10;
    }

    if(b.area > 60){
        score += 10;
    }

    if(b.balcony){
        score += 10;
    }

    if(b.cellar){
        score += 5;
    }

    if(b.elevator){
        score += 5;
    }

    return {
        vyrazen: false,
        score: score
    };
}

function loadApartments(){

    fetch('./apartments.json')
    .then(response => response.json())
    .then(byty => {

        const priceMax =
            parseInt(document.getElementById("priceMax").value);

        const areaMin =
            parseInt(document.getElementById("areaMin").value);

        const vysledek =
            document.getElementById("vysledek");

        vysledek.innerHTML = "";

        byty
        .filter(b => b.price <= priceMax)
        .filter(b => b.area >= areaMin)
        .forEach(b => {

            const info = spocitejSkore(b);

            const div = document.createElement("div");

            if(info.vyrazen){

                div.className = "card bad";

                div.innerHTML = `
                    <h3>${b.title}</h3>
                    <p>❌ Vyřazeno</p>
                    <p>${info.duvod}</p>
                `;

            } else {

                div.className = "card good";

                div.innerHTML = `
                    <h3>${b.title}</h3>

                    <div class="score">
                        ${info.score} bodů
                    </div>

                    <p>
                        Cena:
                        ${b.price.toLocaleString('cs-CZ')} Kč
                    </p>

                    <p>
                        Plocha:
                        ${b.area} m²
                    </p>

                    <p>
                        ${b.url}
